name: 'Outline Security Reporter'
description: 'Parses security scan reports and uploads them to Outline'
branding:
  icon: 'lock'
  color: 'purple'
inputs:
  api-key:
    description: 'Outline API Key'
    required: true
  base-url:
    description: 'Outline Base URL'
    required: true
  collection-id:
    description: 'Outline Collection ID'
    required: true
  report-files:
    description: 'Comma separated list of report files pattern'
    required: true
  publish-path:
    description: 'Path structure for the report (e.g. Reports/CI)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install requests checkov

    - name: Install Trivy
      shell: bash
      run: |
        if ! command -v trivy &> /dev/null; then
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        fi

    - name: Run Checkov
      shell: bash
      run: |
        mkdir -p security-reports
        echo "🚀 Running Checkov..."
        # Use redirection to avoid Checkov creating a directory for multi-framework outputs
        checkov -d infrastructure/ \
            --output json \
            --soft-fail > security-reports/checkov_report.json || true

    - name: Run Trivy
      shell: bash
      run: |
        echo "🚀 Running Trivy..."
        trivy fs . \
            --format json \
            --output security-reports/trivy_report.json \
            --exit-code 0 \
            --scanners vuln,config,secret \
            --ignore-unfixed || true

    - name: Run upload script
      shell: bash
      env:
        OUTLINE_API_KEY: ${{ inputs.api-key }}
        OUTLINE_BASE_URL: ${{ inputs.base-url }}
        OUTLINE_COLLECTION_ID: ${{ inputs.collection-id }}
        REPORT_FILES: ${{ inputs.report-files }}
        JOB_URL: ${{ inputs.job-url }}
        PUBLISH_PATH: ${{ inputs.publish-path }}
      run: |
        python ${{ github.action_path }}/upload.py \
          --api-key "$OUTLINE_API_KEY" \
          --base-url "$OUTLINE_BASE_URL" \
          --collection-id "$OUTLINE_COLLECTION_ID" \
          --report-files "$REPORT_FILES" \
          --job-url "$JOB_URL" \
          --publish-path "$PUBLISH_PATH"
